<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sergio, public grant systems and agent infrastructure</title>
  <desc id="desc">Animated indigo profile banner with an ouroboros-inspired orbital system.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1140" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B1A"/>
      <stop offset="0.48" stop-color="#19174A"/>
      <stop offset="1" stop-color="#343297"/>
    </linearGradient>
    <linearGradient id="ring" x1="850" y1="50" x2="1100" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A6A4FF"/>
      <stop offset="0.5" stop-color="#6A67FF"/>
      <stop offset="1" stop-color="#54D6C7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7774FF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#7774FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <style>
      .orbit { transform-origin: 964px 160px; animation: spin 18s linear infinite; }
      .orbit-reverse { transform-origin: 964px 160px; animation: spin-reverse 12s linear infinite; }
      .pulse { animation: pulse 3.5s ease-in-out infinite; }
      .cursor { animation: blink 1.2s steps(1) infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.96); } 50% { opacity:.9; transform:scale(1.04); } }
      @keyframes blink { 50% { opacity:0; } }
      @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="980" cy="158" r="180" fill="url(#glow)" filter="url(#blur)"/>

  <g class="orbit">
    <circle cx="964" cy="160" r="104" stroke="url(#ring)" stroke-width="3" stroke-dasharray="24 12"/>
    <circle cx="1068" cy="160" r="7" fill="#54D6C7"/>
    <circle cx="860" cy="160" r="5" fill="#A6A4FF"/>
  </g>
  <g class="orbit-reverse">
    <ellipse cx="964" cy="160" rx="142" ry="58" stroke="#A6A4FF" stroke-opacity=".55" stroke-width="2" stroke-dasharray="8 12"/>
    <circle cx="964" cy="102" r="5" fill="#FFFFFF"/>
  </g>
  <g class="pulse" transform-origin="964 160">
    <circle cx="964" cy="160" r="54" fill="#17163F" stroke="#8885FF" stroke-width="2"/>
    <path d="M936 165c8-32 48-38 62-12 14 26-9 50-32 45-23-5-30-30-17-47 12-15 37-13 43 5" stroke="url(#ring)" stroke-width="8" stroke-linecap="round"/>
    <path d="m989 148 9 5-4 10" stroke="#54D6C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="64" y="92" fill="#9D9BFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="3">SERGIOBUILDS / SYSTEMS THAT CLOSE THE LOOP</text>
  <text x="64" y="158" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.5">Public-grant systems</text>
  <text x="64" y="211" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.5">× agent infrastructure<tspan class="cursor" fill="#54D6C7">_</tspan></text>
  <text x="66" y="260" fill="#C8C7E8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="1.05">WASHINGTON STATE CPA  •  3× HACKATHON AWARD WINNER  •  OSS MAINTAINER</text>
</svg>
